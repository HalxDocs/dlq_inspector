name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      # Dual-mode test hooks: unit and safety tests never need these, and the
      # integration suites skip when they are absent, but CI provides real
      # brokers so the full integration surface runs on every push: the
      # adapter conformance suites, the publish/ack write paths, and the
      # end-to-end recovery loops (analyze -> plan -> dry-run -> confirm ->
      # history) for RabbitMQ and Redis Streams.
      DLQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
      DLQ_TEST_MANAGEMENT_URL: http://guest:guest@localhost:15672/
      DLQ_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Go mod tidy drift guard
        # before.hooks runs `go mod tidy` in goreleaser; keep the committed
        # go.mod/go.sum in sync so a release build never mutates the tree.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        # -count=1: setup-go persists the Go cache across runs, and go test's
        # result cache does not include environment variables in its key -- a
        # run where the live-broker tests skipped could otherwise be cached as
        # "ok" and mask the skip forever. Uncounted runs always execute.
        run: go test -count=1 ./...

      # The end-to-end recovery loop is the v0.1 gate: analyze -> plan -> dry-run
      # -> confirm-recover -> history against real brokers, plus the
      # missing-destination refusal scenarios, the single-message replay
      # refusal, the policy-driven DO_NOT_REPLAY scenario, the shared
      # conformance suites, and the same loop over Redis Streams. Run each
      # explicitly per package and fail the workflow if any ever skips, so a
      # silent skip can never pass as coverage.
      - name: "Integration: full recovery loop"
        run: |
          go test -count=1 -v -run 'TestRecoveryLoop(EndToEnd|MissingDestination|Policy)|TestReplayMissingDestinationLive|TestConformance' ./internal/broker/rabbitmq/ | tee /tmp/recovery-rabbit.log
          go test -count=1 -v -run 'TestRecoveryLoop(OverRedis|MissingDestinationOverRedis|PolicyOverRedis)|TestRecoveryPendingBacklogWarning|TestConformance|TestStats(MissingStream|PendingCounts)|TestQueuesShowsPending' ./internal/broker/redisstream/ | tee /tmp/recovery-redis.log
          grep -- '--- PASS: TestRecoveryLoopEndToEnd' /tmp/recovery-rabbit.log
          grep -- '--- PASS: TestRecoveryLoopMissingDestination' /tmp/recovery-rabbit.log
          grep -- '--- PASS: TestRecoveryLoopPolicy' /tmp/recovery-rabbit.log
          grep -- '--- PASS: TestReplayMissingDestinationLive' /tmp/recovery-rabbit.log
          grep -- '--- PASS: TestConformance' /tmp/recovery-rabbit.log
          grep -- '--- PASS: TestRecoveryLoopOverRedis' /tmp/recovery-redis.log
          grep -- '--- PASS: TestRecoveryLoopMissingDestinationOverRedis' /tmp/recovery-redis.log
          grep -- '--- PASS: TestRecoveryLoopPolicyOverRedis' /tmp/recovery-redis.log
          grep -- '--- PASS: TestConformance' /tmp/recovery-redis.log
          grep -- '--- PASS: TestStatsMissingStream' /tmp/recovery-redis.log
          grep -- '--- PASS: TestStatsPendingCounts' /tmp/recovery-redis.log
          grep -- '--- PASS: TestQueuesShowsPending' /tmp/recovery-redis.log
          grep -- '--- PASS: TestRecoveryPendingBacklogWarning' /tmp/recovery-redis.log

  # The Homebrew tap must keep working end to end: macos runners ship
  # Homebrew, so tap HalxDocs/homebrew-tap, install dlq-inspector (which
  # downloads the darwin archive and verifies its pinned sha256), and run the
  # installed binary. A formula that drifted from the release assets fails
  # the main repo's build at commit time.
  brew-tap:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dlq-inspector from the Homebrew tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew tap HalxDocs/homebrew-tap
          # Newer Homebrew refuses formulas from untrusted third-party taps.
          brew trust halxdocs/tap
          brew install dlq-inspector
          dlq version

  # The one-command installers must never install a corrupted binary: serve a
  # fake release tree from a local HTTP server, prove the control path installs
  # on both bash and PowerShell, then corrupt the archive and assert both
  # installers fail with a checksum error and leave nothing behind.
  installers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Installer control + checksum-refusal tests
        run: bash scripts/test-installers.sh

  # Build the full cross-platform release matrix on every push and PR so
  # config drift (wrong template keys, bad ldflags, a broken archive step) is
  # caught at commit time instead of at release time. Snapshot artifacts are
  # uploaded from pushes; PR runs build-only.
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Upload snapshot artifacts (pushes only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dlq-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/artifacts.json
          retention-days: 30
