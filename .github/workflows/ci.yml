name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672

    env:
      # Dual-mode test hooks: unit and safety tests never need these, and the
      # integration suites skip when they are absent, but CI provides a real
      # broker so the full integration surface runs on every push: the
      # adapter conformance suite, the publish/ack write path, and the
      # end-to-end recovery loop (analyze -> plan -> dry-run -> confirm ->
      # history) in internal/broker/rabbitmq/recovery_integration_test.go.
      DLQ_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
      DLQ_TEST_MANAGEMENT_URL: http://guest:guest@localhost:15672/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        # -count=1: setup-go persists the Go cache across runs, and go test's
        # result cache does not include environment variables in its key -- a
        # run where the live-broker tests skipped could otherwise be cached as
        # "ok" and mask the skip forever. Uncounted runs always execute.
        run: go test -count=1 ./...

      # The end-to-end recovery loop is the v0.1 gate: analyze -> plan -> dry-run
      # -> confirm-recover -> history against a real broker, plus the
      # missing-destination refusal scenarios for both the batch recover and
      # the single-message replay paths, and the policy-driven DO_NOT_REPLAY
      # scenario. Run each explicitly and fail the workflow if any ever
      # skips, so a silent skip can never pass as coverage.
      - name: "Integration: full recovery loop"
        run: |
          go test -count=1 -v -run 'TestRecoveryLoop(EndToEnd|MissingDestination|Policy)|TestReplayMissingDestinationLive' ./internal/broker/rabbitmq/ | tee /tmp/recovery-test.log
          grep -- '--- PASS: TestRecoveryLoopEndToEnd' /tmp/recovery-test.log
          grep -- '--- PASS: TestRecoveryLoopMissingDestination' /tmp/recovery-test.log
          grep -- '--- PASS: TestRecoveryLoopPolicy' /tmp/recovery-test.log
          grep -- '--- PASS: TestReplayMissingDestinationLive' /tmp/recovery-test.log
